<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Rush - Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #94a3b8;
        }

        .quote {
            font-size: 20px;
            line-height: 1.6;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            user-select: none;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 18px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        button {
            margin-top: 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Type Rush ⚡</h1>
        <div class="stats">
            <div>Time: <span id="timer">0</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
        </div>
        <div class="quote" id="quote"></div>
        <textarea id="input" placeholder="Start typing the text above..."></textarea>
        <button onclick="resetGame()">New Text</button>
    </div>

    <script>
        const quotes = [
            "Code is like humor. When you have to explain it, it is bad.",
            "First, solve the problem. Then, write the code.",
            "Experience is the name everyone gives to their mistakes.",
            "Simplicity is the soul of efficiency.",
            "Make it work, make it right, make it fast."
        ];

        const quoteEl = document.getElementById('quote');
        const inputEl = document.getElementById('input');
        const timerEl = document.getElementById('timer');
        const wpmEl = document.getElementById('wpm');

        let startTime = null;
        let timerInterval = null;
        let currentQuote = "";

        function resetGame() {
            clearInterval(timerInterval);
            startTime = null;
            timerEl.textContent = "0";
            wpmEl.textContent = "0";
            inputEl.value = "";
            inputEl.disabled = false;
            currentQuote = quotes[Math.floor(Math.random() * quotes.length)];
            quoteEl.textContent = currentQuote;
        }

        inputEl.addEventListener('input', () => {
            if (!startTime) {
                startTime = new Date();
                timerInterval = setInterval(updateTimer, 1000);
            }

            if (inputEl.value === currentQuote) {
                clearInterval(timerInterval);
                inputEl.disabled = true;
                calculateWPM();
            }
        });

        function updateTimer() {
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            timerEl.textContent = elapsed;
        }

        function calculateWPM() {
            const elapsedMinutes = (new Date() - startTime) / 60000;
            const words = currentQuote.split(" ").length;
            const wpm = Math.round(words / elapsedMinutes);
            wpmEl.textContent = wpm;
        }

        resetGame();
    </script>

</body>
</html>
